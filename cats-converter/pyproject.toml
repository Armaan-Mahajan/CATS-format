[project]
name = "cats-converter"
version = "1.0.0"
description = "Reference converter between JSON Schema tool definitions and CATS (Compact Agent Tool Schema)."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11,<3.14"
dependencies = [
    "bfcl-eval==2026.3.23",
    "matplotlib>=3.11.0",
    "python-dotenv>=1.2.2",
    "statsmodels>=0.14.6",
]

[dependency-groups]
dev = [
    "anthropic==0.109.1",
    "fastapi>=0.136.3",
    "huggingface-hub>=0.30.0",
    "hypothesis>=6.155.1",
    "hypothesis-jsonschema>=0.23.1",
    "jsonschema>=4.26.0",
    "pytest>=9.0.3",
    "soundfile>=0.14.0",
    "tiktoken==0.13.0",
    "transformers==5.11.0",
    "uvicorn>=0.49.0",
]

[tool.pytest.ini_options]
# Project root is on the path so `import cats` (cats.py) and `import oracle` work.
pythonpath = [".", ".."]
testpaths = ["tests"]
